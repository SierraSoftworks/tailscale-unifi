on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increment
        type: choice
        options: [patch, minor, major]
        default: patch

name: Release

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: "Publish"
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: ./tests/run.sh
      - run: ./build/package.sh ./ ./dist
      - uses: SierraSoftworks/gh-releases@a1d47201b036e0d4843d05ce56bde67dc262b95f # v1.1.0
        id: release
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          bump: ${{ inputs.bump }}
          create: "true"
          publish: "true"
          notes-template: .github/release-template.md
          files: |
            ./dist/tailscale-unifi.tgz
            ./dist/tailscale-unifi.tgz | tailscale-udm.tgz
      - run: echo "Published [${{ steps.release.outputs.tag }}](${{ steps.release.outputs.url }})" >> "$GITHUB_STEP_SUMMARY"
